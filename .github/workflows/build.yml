name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6.0.2
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v6.0.2
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0

      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE/builds/"*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Setup Android SDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          find . -path "*/build/*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \; || echo "No .cs3 files found"
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/" || echo "No plugins.json found"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if [[ -n $(git status -s) ]]; then
            git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
            git push --force
          else
            echo "No changes to push"
          fi
